[project]
name = "wnl-utils"
version = "0.1.0"
description = "WNL utility package for python project. Currently with geospatial mapkit tools."
readme = "README.md"
authors = [
    { name = "Emmakeston", email = "emma.keston@nhs.net" },
    { name = "Emily Baldwin", email = "emily.baldwin20@nhs.net" }
]
requires-python = ">=3.12"
[project]
dependencies = [
    "geopandas>=0.14",
    "matplotlib>=3.7",
    "numpy>=1.15",
    "pandas>=2.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.4.4",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"
