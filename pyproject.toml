[project]
name = "wnl-utils"
version = "0.1.0"
description = "WNL utility package for python project. Currently with geospatial mapkit tools."
readme = "README.md"
authors = [
    { name = "Emmakeston", email = "emma.keston@nhs.net" },
    { name = "Emily Baldwin", email = "emily.baldwin20@nhs.net" }
]
requires-python = ">=3.12"
dependencies = [
    "build>=1.4.4",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "shapely>=2.1.2",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"
